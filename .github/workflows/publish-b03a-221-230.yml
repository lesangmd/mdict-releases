name: Publish Android Data Channel B03A 221-230

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-b03a-221-230.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify B03A package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/packages
          cat .publish-staging/b03a.part1.b64 .publish-staging/b03a.part2.b64 .publish-staging/b03a.part3.b64 .publish-staging/b03a.part4.b64 | base64 -d > data/packages/MEDIPHARM-Learning-Terminology-Clinical-Pharmacy-B03A-221-230-v1.0.0.zip
          test "$(stat -c %s data/packages/MEDIPHARM-Learning-Terminology-Clinical-Pharmacy-B03A-221-230-v1.0.0.zip)" = "17472"
          test "$(sha256sum data/packages/MEDIPHARM-Learning-Terminology-Clinical-Pharmacy-B03A-221-230-v1.0.0.zip | awk '{print $1}')" = "d91481ea14d81bee6585f27aaa7c97b1ac45485fc2a26ac47a7023daea2071fa"
          unzip -t data/packages/MEDIPHARM-Learning-Terminology-Clinical-Pharmacy-B03A-221-230-v1.0.0.zip

      - name: Update Android data manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, datetime
          from pathlib import Path
          p=Path('data/mdict-data-manifest.json')
          d=json.loads(p.read_text())
          now=datetime.datetime.now(datetime.timezone.utc)
          d['dataVersion']=now.strftime('%Y.%m.%d.%H%M%S')
          d['publishedAt']=now.strftime('%Y-%m-%dT%H:%M:%SZ')
          d['minimumAppVersionCode']=12017
          learning=d['modules']['learning']
          assert learning['baseline']['recordCount']==220
          learning['recordCountEffective']=230
          learning['packages']=[{
            'schema':'nahmed-learning-terminology-wave/v1',
            'url':'https://raw.githubusercontent.com/lesangmd/mdict-releases/main/data/packages/MEDIPHARM-Learning-Terminology-Clinical-Pharmacy-B03A-221-230-v1.0.0.zip',
            'sha256':'d91481ea14d81bee6585f27aaa7c97b1ac45485fc2a26ac47a7023daea2071fa'
          }]
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Validate manifest contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/mdict-data-manifest.json'))
          l=d['modules']['learning']
          assert d['schema']=='mdict-offline-data-manifest/v1'
          assert d['minimumAppVersionCode']==12017
          assert l['baseline']['recordCount']==220
          assert l['recordCountEffective']==230
          assert len(l['packages'])==1
          assert l['packages'][0]['schema']=='nahmed-learning-terminology-wave/v1'
          assert l['packages'][0]['sha256']=='d91481ea14d81bee6585f27aaa7c97b1ac45485fc2a26ac47a7023daea2071fa'
          print('PASS Android Data Channel learning effective count = 230')
          PY

      - name: Commit verified package and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f .publish-staging/b03a.part1.b64 .publish-staging/b03a.part2.b64 .publish-staging/b03a.part3.b64 .publish-staging/b03a.part4.b64
          git config user.name "mDict Data Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add data/mdict-data-manifest.json data/packages/MEDIPHARM-Learning-Terminology-Clinical-Pharmacy-B03A-221-230-v1.0.0.zip
          git add -u .publish-staging
          git commit -m "Publish Android learning wave B03A 221-230"
          git push
