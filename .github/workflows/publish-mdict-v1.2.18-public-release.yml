name: Publish mDict v1.2.18 Public APK Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mdict-v1.2.18-public-release.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout public APK assets already uploaded
        uses: actions/checkout@v4

      - name: Verify uploaded APK files and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd mdict-v1.2.18-public-release
          test -f mDict-latest.apk
          test -f mDict-v1.2.18-release.apk
          test -f SHA256SUMS.txt
          test "$(stat -c%s mDict-latest.apk)" -gt 10000000
          cmp -s mDict-latest.apk mDict-v1.2.18-release.apk
          sha256sum --check SHA256SUMS.txt
          test "$(sha256sum mDict-latest.apk | awk '{print $1}')" = "a8b5288acb4c206a584d4ff70db8b9ed0e6de173fa5ad6da0506b0dc245e503f"
          echo "PASS uploaded APK binary identity and release checksums"

      - name: Install Android signature verification tools
        uses: android-actions/setup-android@v3

      - name: Validate version, package and canonical production signing
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          APK=mdict-v1.2.18-public-release/mDict-latest.apk
          BADGING="$("$SDK/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1)"
          printf '%s\n' "$BADGING"
          grep -q "package: name='com.medipharm.mdict'" <<< "$BADGING"
          grep -q "versionCode='12018'" <<< "$BADGING"
          grep -q "versionName='1.2.18'" <<< "$BADGING"
          "$SDK/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/mdict-signature.txt
          grep -qi "cabe20b2f350b0450f588ec719d2e09a6a4f8c8905f89d9aa86c3a93aabd8e73" /tmp/mdict-signature.txt
          echo "PASS package/version and canonical signing certificate"

      - name: Publish v1.2.18 on PUBLIC repository as Latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd mdict-v1.2.18-public-release
          NOTES="mDict Android v1.2.18 — Direct APK Installer Update. Signed with the canonical production certificate. Adds in-app download, APK integrity/version/signer verification and direct handoff to the Android system package installer. Authentication stays with MEDIPHARM Membership."
          if gh release view v1.2.18 >/dev/null 2>&1; then
            gh release upload v1.2.18 mDict-latest.apk mDict-v1.2.18-release.apk SHA256SUMS.txt --clobber
            gh release edit v1.2.18 --title "mDict v1.2.18" --notes "$NOTES" --latest
          else
            gh release create v1.2.18 mDict-latest.apk mDict-v1.2.18-release.apk SHA256SUMS.txt --title "mDict v1.2.18" --notes "$NOTES" --latest
          fi

      - name: Verify public release and downloadable assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view v1.2.18 --json isLatest,isDraft,isPrerelease,assets --jq '.isLatest == true and .isDraft == false and .isPrerelease == false and (.assets | map(.name) | index("mDict-latest.apk") != null)'
          TEST_DIR="$(mktemp -d)"
          curl --fail --location --retry 3 --retry-delay 2 "https://github.com/lesangmd/mdict-releases/releases/download/v1.2.18/mDict-latest.apk" -o "$TEST_DIR/mDict-latest.apk"
          test "$(sha256sum "$TEST_DIR/mDict-latest.apk" | awk '{print $1}')" = "a8b5288acb4c206a584d4ff70db8b9ed0e6de173fa5ad6da0506b0dc245e503f"
          echo "PASS public release download anonymous checksum"
